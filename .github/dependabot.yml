# Automated dependency updates.
#
# This was disabled for a while: its first-ever run opened ~19 PRs across two
# repos at once. That was mostly a one-time effect of the repo never having
# had dependency scanning before -- there was a lot to catch up on -- but the
# config made it worse, and the settings below are the tightened version:
#
# - open-pull-requests-limit 3 per ecosystem, so only a handful can ever be
#   open at once and nothing new appears until they're dealt with.
# - `cooldown`, so a version released in the last few days doesn't show up
#   immediately -- longer for majors, which more often get a quick patch
#   fixing a launch-day bug.
# - one grouped PR per ecosystem per cycle, covering every update type.
#   Separate PRs all touching the same package-lock.json caused a
#   merge-conflict cascade last time: merging one invalidated the next one's
#   lockfile diff. The tradeoff is that a genuinely breaking major can block
#   its whole group -- which is CI doing its job, but it means someone has to
#   split that one out by hand rather than the rest sailing past it.
# - each ecosystem on a different day, so a busy week doesn't land at once.
#
# Re-enabled after clearing the backlog that caused the original pile-up:
# every dependency in both workspaces is current, the Prisma 7 migration and
# the React 19 upgrade (the two genuine migrations left over from the first
# run) are both done, and the frontend reports zero vulnerabilities.
#
# Known standing alert -- do not "fix" it:
#   `npm audit` reports 4 high-severity advisories in mysql2. It reaches the
#   production tree through @prisma/client -> prisma -> mysql2. Both
#   advisories require an open connection to a MySQL server; this app's
#   datasource is postgresql, it connects through @prisma/adapter-pg, and
#   mysql2 is never loaded at runtime (verified: 0 mysql modules in
#   require.cache after booting the app). It is shipped but never executed.
#
#   `npm audit fix --force` "resolves" this by DOWNGRADING prisma from 7.x to
#   6.19.3 -- a breaking change, backwards, to patch something unreachable.
#   Don't run it. The real fix arrives with Prisma 8, which is still a
#   release candidate as of this writing.
#
# There is deliberately no `npm audit` step in CI. With the above standing
# permanently, it would be permanently red, and a CI check that's always red
# is one people learn to ignore. Dependabot's own alerts cover it.
#
# To pause this again: rename the file to dependabot.yml.disabled -- only the
# exact name dependabot.yml activates version updates.
version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      backend-updates:
        patterns: ["*"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      frontend-updates:
        patterns: ["*"]

  # The GitHub Actions workflows themselves (actions/checkout, setup-node,
  # aws-actions/configure-aws-credentials, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      actions-updates:
        patterns: ["*"]
