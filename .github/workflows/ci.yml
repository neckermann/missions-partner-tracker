name: CI

# Branches: work lands on `dev`, ships via a pull request into `main`.
# `main` is production -- Render tracks the repo's default branch and
# deploys on push, so a merge here is a release. See CONTRIBUTING.md
# § Branches and releasing.
#
# `main` is protected upstream: no direct pushes, and the four jobs below
# must pass before a PR can merge.
#
# ONE trigger, deliberately. This used to run on pushes to main and dev as
# well, which meant three runs per change:
#
#   1. push to dev          |  same commit, both fired, four checks
#   2. pull_request opened  |  reported twice ("8 pass")
#   3. push to main         |  after the merge
#
# None of the extras were earning their keep. GitHub checks out
# `refs/pull/N/merge` for a pull_request event -- the *result* of merging
# dev into main -- so by the time the gate is green, the exact tree that
# becomes main has already been tested. Verified: PR run and post-merge
# main run had the identical tree, 48510f6.
#
# The main run protected nothing either. render.yaml sets no autoDeploy, so
# Render deploys the moment main moves, in parallel with that run. It was a
# notification, not a gate.
#
# Not solved with a `concurrency` group, which was the obvious idea: a push
# run and a PR run sharing a group means one cancels the other, and if the
# loser is the PR run then a *required* check reports "cancelled" and the
# pull request can never merge. A stuck gate is worse than a wasted minute.
#
# The cost: a branch with no pull request open gets no CI. Open the PR --
# a draft is fine, it still runs -- which is where you'd be reading the
# result anyway.
#
# No `paths` filter here, on purpose. A required status check only passes
# when it actually reports, and a filtered-out workflow never reports at
# all, so a docs-only PR would wait forever on a check that will never run.
on:
  pull_request:
    branches: [main, dev]

# Superseded runs on the same pull request are cancelled when you push
# again. Keyed by PR number so this only ever cancels within one PR's own
# stream -- never across the push/PR boundary, for the reason above.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and on its own: it needs no database and no build, so a style
  # or accessibility regression fails in well under a minute rather than
  # after the e2e job has spun up Postgres.
  #
  # --quiet means errors only. Warnings are a deliberate to-do list (missing
  # hook deps, autofocus on the login form) and are visible locally via
  # `npm run lint`; gating on them would make this job red on day one, and a
  # check that is always red is one people stop reading.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install lint tooling
        run: npm ci
      - name: Lint
        run: npx eslint . --quiet
      - name: Check formatting
        run: npx prettier --check .

  backend-tests:
    runs-on: ubuntu-latest
    env:
      # No real database here -- these are pure unit tests (see
      # CONTRIBUTING.md). `npm test` globs test/*.test.js only; the
      # route-level tests live in test/routes/ and run in the e2e job
      # below, which has Postgres. This exists only so `npm ci`'s postinstall
      # (`prisma generate`) doesn't fail: Prisma 7's prisma.config.js
      # `env("DATABASE_URL")` throws if the variable is unset at all,
      # even though `generate` itself never opens a connection.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      # Deliberately NOT UTC.
      #
      # GitHub runners default to UTC, which is the one timezone where this
      # app's date bugs hide. `birthday` and the other date-only columns come
      # back from Prisma as UTC midnight, so reading them with local getters
      # is correct in UTC and off by a day everywhere west of it. Verified:
      # reintroduce that bug and test/birthdays.test.js still passes under
      # TZ=UTC, and fails under this one.
      #
      # Any US zone would do; this is the one the first such bug was found in
      # (every date field pre-filling tomorrow after 5pm, fixed in 32aae84).
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install and test
        run: |
          cd backend
          npm ci
          npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test and build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build
      # Written into backend/public (see frontend/vite.config.js) -- shared
      # with the e2e job below so the frontend is only built once per run.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/public
          retention-days: 1

  # Boots a real Postgres-backed instance of the app (fresh database,
  # freshly seeded, a throwaway admin login created just for this run) and
  # runs the committed Playwright suite (frontend/e2e/) against it --
  # covers login, the public directory/map, and admin CRUD including the
  # country/FIPS auto-fill -- plus an accessibility pass (axe-core) on the
  # public-facing pages and the admin dashboard.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
      SESSION_SECRET: e2e-only-not-a-real-secret-${{ github.run_id }}
      # Must decode to exactly 32 bytes -- utils/crypto.js rejects anything
      # else. The previous value here was 31 bytes, so every MFA operation
      # threw, and nothing noticed for weeks because nothing tested MFA.
      # e2e/auth-boundary.spec.js now does, so a bad key fails the build.
      FIELD_ENCRYPTION_KEY: OZcy7VVp+6VxqdngsHi9OD2RqdRR1yjPbLqI6N01zmQ=
      APP_BASE_URL: http://localhost:4000
      NOMINATIM_CONTACT: e2e-ci@example.com
      NODE_ENV: test
      PORT: 4000
      E2E_BASE_URL: http://localhost:4000
      E2E_ADMIN_EMAIL: e2e@example.com
      E2E_ADMIN_PASSWORD: E2eOnlyPassword123!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/public

      - name: Install backend deps
        run: cd backend && npm ci

      # Playwright itself (@playwright/test, @axe-core/playwright) lives in
      # frontend/'s devDependencies -- the frontend-build job's own `npm ci`
      # doesn't carry over here, only the build artifact downloaded above.
      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Apply migrations and seed
        run: |
          cd backend
          npx prisma migrate deploy
          npm run seed
          node prisma/createAdmin.js "$E2E_ADMIN_EMAIL" "$E2E_ADMIN_PASSWORD"

      # Runs here rather than in the backend-tests job because these boot
      # the real app against a real database -- that job deliberately has
      # neither. Ordered before the app boots so a route-level regression
      # fails fast, without waiting on Playwright.
      - name: Run backend route tests
        run: cd backend && npm run test:routes

      - name: Boot the app
        run: |
          cd backend
          node src/server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 1
          done
          echo "App never became healthy."
          exit 1

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: cd frontend && npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
