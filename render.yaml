# Render Blueprint — deploys this app with one click. See
# ADMIN_GUIDE.md § Deploying anywhere else for the full picture, and
# https://render.com/docs/blueprint-spec for the format itself.
#
# Two services plus one Postgres database (which also holds every
# uploaded photo/newsletter/document -- see the comment on the Newsletter
# model in backend/prisma/schema.prisma): a web service (serves both the
# API and the built frontend -- see backend/src/server.js) and a
# Background Worker (runs the email/GroupMe/trip-reminder schedulers and
# the WhatsApp connection -- see backend/src/worker.js). #271 Phase B
# split these into separate processes so a crash or restart in one never
# takes down the other, and so this app can never accidentally run two
# copies of the schedulers at once if the web service is ever scaled past
# one instance.
#
# Plan values below (`starter` / `0.1c-256mb`) are the cheapest paid
# tiers Render offers, verified against a real deploy — about $13/mo for
# the web service + database, plus another ~$7/mo for the worker. Free-
# tier equivalents exist but aren't viable for anything beyond a quick
# check: free web/worker services sleep after 15min idle (30-60s cold
# start on the next request -- and a sleeping worker simply never fires
# its schedules) and free Postgres instances expire and get deleted after
# 90 days.
#
# Region is `oregon`, which is also Render's own default -- so a Blueprint
# deploy puts everything exactly where Render would have put it anyway, and
# nobody gets a surprise. Valid values: oregon, ohio, virginia, frankfurt,
# singapore. The database and web service must use the same region.
#
# To deploy elsewhere, set it before your first deploy:
#   npm run name-instance -- <your-church-name> <region>
# Render's Blueprint UI has no region picker -- it only prompts for
# `sync: false` env vars -- so it has to be in this file beforehand.
#
# WARNING: changing this on an instance that is ALREADY DEPLOYED does not
# move anything. Render's spec: "You can't modify this value after
# creation." What actually happens is that every subsequent Blueprint sync
# fails silently -- the services keep running, so nothing looks broken, and
# you find out weeks later. This project's demo lost two weeks of blueprint
# syncs to exactly that, after a well-meant change of this default.
#
# Which is why the default is now the platform's own: a default that
# matches what Render does anyway can't quietly break someone downstream.
databases:
  - name: missions-partner-tracker-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: missions_partner_tracker

services:
  - name: missions-partner-tracker
    type: web
    runtime: node
    plan: starter
    region: oregon
    # --include=dev on both installs: NODE_ENV is set below (needed at
    # runtime) and is visible during the build too, and npm's default
    # behavior is to silently skip devDependencies whenever
    # NODE_ENV=production is set. On the frontend that's where Vite
    # lives (the build fails outright with "vite: not found" without
    # this). On the backend it's where the `prisma` CLI lives -- without
    # it, `npx prisma migrate deploy`/`migrate reset` still "work" by
    # silently downloading prisma fresh from the registry every time
    # instead of using the pinned version already in package-lock.json,
    # which is slower and not actually reproducible.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev
    startCommand: cd backend && node src/server.js
    # Runs after the build above but before the new version takes
    # traffic -- applies any pending schema changes first, so a rolling
    # deploy never has new code running against an old schema. Only
    # additive/backwards-compatible migrations should ever ship, since
    # the previous app version keeps serving traffic against the new
    # schema for the short window until the new version is live.
    preDeployCommand: cd backend && npx prisma migrate deploy
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: missions-partner-tracker-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Generated automatically at deploy time -- nothing to fill in.
      - key: SESSION_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      # Optional. Shown in a user's authenticator app when they enroll in
      # MFA. Leave blank to use the default ("Missions Partner Tracker
      # Admin").
      - key: MFA_ISSUER
        sync: false
      # Optional but recommended. Nominatim's (the free geocoding
      # service this app uses) usage policy requires identifying
      # requests with a real contact email.
      - key: NOMINATIM_CONTACT
        sync: false

  # #271 Phase B -- the schedulers/WhatsApp half of what used to run
  # inside the web service above. `type: worker` (not `web`, not `cron`):
  # this needs to stay running continuously, not serve HTTP traffic and
  # not start/run-once/exit. See backend/src/worker.js's own header
  # comment for the full reasoning.
  - name: missions-partner-tracker-worker
    type: worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev
    startCommand: cd backend && node src/worker.js
    envVars:
      # Same database as the web service above -- this process reads/
      # writes the exact same tables (ChurchSettings, DispatchRecord,
      # etc.), it's not a separate data store.
      - key: DATABASE_URL
        fromDatabase:
          name: missions-partner-tracker-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Only here so this process passes the same startup safety check
      # (config/env.js) the web service does -- this process never signs
      # or verifies a session itself, so this value never needs to match
      # the web service's own SESSION_SECRET.
      - key: SESSION_SECRET
        generateValue: true
      # MUST be the exact same value as the web service's own
      # FIELD_ENCRYPTION_KEY, copied by hand -- never generateValue: true
      # here. This process decrypts the identical encrypted tokens
      # (GroupMe access token, Postmark server token, WhatsApp session
      # credentials) the web service wrote; a freshly generated key here
      # can't decrypt anything the web service encrypted, and every
      # decrypt call throughout worker.js's schedulers/WhatsApp client
      # would fail. Copy the web service's current value from Render's
      # dashboard (its Environment tab) into this service's own
      # Environment tab after both services exist -- Blueprint sync alone
      # cannot do this for you, since `sync: false` means Render always
      # leaves it for a human to set.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
